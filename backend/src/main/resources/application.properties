# 애플리케이션 이름
spring.application.name=swim-mall

# HTTP 요청/응답 기본 인코딩 (한글 깨짐 방지 보조)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# 데이터베이스 연결 (backend/.env 또는 환경 변수 DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/LetsDiveIn}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Flyway 설정
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 이메일 설정 (계정/비밀번호: SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD 또는 backend/.env)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 애플리케이션 기본 URL
app.base-url=http://localhost:8080

# 더미 데이터 초기화 (개발 환경에서만 true로 설정)
app.data.init.enabled=true

# 파일 업로드 설정
app.file.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Toss Payments 시크릿 키 (PAYMENTS_TOSS_SECRET_KEY 또는 backend/.env)
payments.toss.secret-key=${PAYMENTS_TOSS_SECRET_KEY}
# 로컬에서만: 승인 API에 TossPayments-Test-Code 헤더로 실패 재현 (예: REJECT_CARD_PAYMENT). 비우면 미전송.
#payments.toss.test-code=REJECT_CARD_PAYMENT

#RETURN_ASSIST_ENABLED=false